[project]
name = "hifi"
version = "0.1.0"
description = "HiFi: High-Fidelity Financial Intelligence - A fully local multi-agent financial intelligence platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Alberto Espinosa" },
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "yfinance>=1.4.1",
    "fredapi>=0.5.2",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "mcp>=1.0",
    "quantstats>=0.0.62",
    "openai>=1.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langfuse>=2.60,<3",
    "lancedb>=0.8",
    "pylance>=7.0.0",
    "filelock>=3.12",
    "networkx>=3.6.1",
    "scipy>=1.17.1",
    "alpaca-py>=0.43.5",
    # Arm D's signal provider (DJ-113). Declared rather than installed by hand:
    # it lives in a sibling repo, so before DJ-136 it was in the venv and in no
    # manifest, and a routine `uv sync` removed it — silently disabling a live
    # experimental arm while the other three kept running.
    "riskbudget>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hifi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may involve multiple components)",
    "holistic: Holistic tests (full pipeline validation)",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

# One dev group, not two (DJ-136).
#
# pytest-cov, ruff and mypy used to live in [project.optional-dependencies].dev
# while this group held pytest, responses and vcrpy. uv installs THIS group by
# default, so the environment never had pytest-cov or mypy — coverage had never
# been measured on this project and the [tool.mypy] block below had never been
# executed, while both appeared, to a reader, to be part of the toolchain.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "responses>=0.26.1",
    "vcrpy>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.coverage.run]
source = ["src/hifi"]
# Branch coverage, not just line coverage. This code is dense with `if not
# is_dry`, `if dry_run` and fail-open `except` handlers; line coverage marks
# those executed while never taking the branch that matters. DJ-136 lived on
# exactly such a branch.
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.uv.sources]
# riskbudget is a finished, versioned sibling project whose internals HiFi never
# modifies (DJ-113). A path source keeps `uv sync` idempotent: without it the
# package is present only because someone once installed it by hand, and the
# next sync silently removes arm D from the experiment.
riskbudget = { path = "../decon-fin/riskbudget", editable = true }
