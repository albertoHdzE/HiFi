[project]
name = "hifi"
version = "0.1.0"
description = "HiFi: High-Fidelity Financial Intelligence - A fully local multi-agent financial intelligence platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Alberto Espinosa" },
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "yfinance>=1.4.1",
    "fredapi>=0.5.2",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "mcp>=1.0",
    "quantstats>=0.0.62",
    "openai>=1.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langfuse>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hifi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may involve multiple components)",
    "holistic: Holistic tests (full pipeline validation)",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[dependency-groups]
dev = [
    "responses>=0.26.1",
    "vcrpy>=6.0",
]
